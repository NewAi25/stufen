name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stufen
          POSTGRES_USER: stufen
          POSTGRES_PASSWORD: stufen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stufen -d stufen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://stufen:stufen@localhost:5432/stufen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The packageManager field in package.json pins pnpm 9.15.9 for corepack.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check box boundaries
        run: node scripts/check-boundaries.mjs

      - name: Validate content packs
        run: node scripts/validate-content.mjs

      - name: Run box tests
        run: pnpm test
        env:
          # Unit tests only. Database tests run in the next step, one file at a time.
          DATABASE_URL: ''

      - name: Run database tests
        run: pnpm test:db

      - name: Build the web app
        run: pnpm --filter @stufen/web build

  # Builds the image and runs the whole stack as a server would: Postgres,
  # migrations and pack install, a local mail catcher, then the web app.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose --profile app up -d --build

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 5
          done
          echo "the app did not answer in time"
          exit 1

      - name: Check the running app
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "307"
          docker compose --profile app ps -a

      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color | tail -n 300

      - name: Stop the stack
        if: always()
        run: docker compose --profile app down -v
