name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The packageManager field in package.json pins pnpm 9.15.9 for corepack.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check box boundaries
        run: node scripts/check-boundaries.mjs

      - name: Validate content packs
        run: node scripts/validate-content.mjs

      - name: Run box tests
        run: pnpm test
