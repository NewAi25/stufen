name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      # No lockfile exists until Phase 0 runs pnpm install for the first time.
      # Remove continue-on-error once pnpm-lock.yaml is committed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Check box boundaries
        run: node scripts/check-boundaries.mjs

      - name: Validate content packs
        run: node scripts/validate-content.mjs

      # Boxes have no tests yet. Remove continue-on-error when Phase 0 lands
      # and the first box test exists.
      - name: Run box tests
        run: pnpm test
        continue-on-error: true
